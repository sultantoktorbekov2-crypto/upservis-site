<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет заведения</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;max-width:760px;margin:0 auto;padding:20px;color:#111}
h1{font-size:20px;margin-bottom:4px}h1 small{display:block;font-size:12px;color:#777;font-weight:400}
.banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:14px;color:#92400e;margin:12px 0}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{border:1px solid #e2e2e2;border-radius:999px;padding:6px 14px;font-size:14px;background:none;color:#777;cursor:pointer}
.tab.on{background:#111;color:#fff;border-color:#111}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:#777;font-weight:400;padding:6px 8px;border-bottom:1px solid #e2e2e2}
td{padding:9px 8px;border-bottom:1px solid #e2e2e2;vertical-align:middle}
input,select{border:1px solid #e2e2e2;border-radius:8px;padding:7px 9px;font-size:14px}
input:focus,select:focus{outline:1px solid #111}
.chip{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px}
.warn{background:#d9770622;color:#b45309}
.btn{border:1px solid #e2e2e2;border-radius:8px;padding:6px 12px;font-size:13px;background:#fff;cursor:pointer}
.btn:hover{background:#f5f5f5}
.btn.p{background:#111;color:#fff;border-color:#111}
.btn.p:hover{opacity:.85}
.btn.danger{border-color:#dc2626;color:#dc2626}
.login{max-width:320px;margin:80px auto;text-align:center}
.lin{width:100%;border:1px solid #e2e2e2;border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:10px;text-align:left}
.addrow{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
.addrow input,.addrow select{width:auto;flex:1;text-align:left;padding:8px 10px}
.ord{border:1px solid #e2e2e2;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.ord .h{display:flex;justify-content:space-between;margin-bottom:4px}
.note{font-size:13px;color:#777}
.cat{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin:18px 0 4px}
.trow{display:flex;align-items:center;gap:14px;border:1px solid #e2e2e2;border-radius:12px;padding:12px;margin-bottom:10px;flex-wrap:wrap}
.trow .q{width:120px;height:120px;flex-shrink:0}
.trow .q img,.trow .q canvas{width:120px!important;height:120px!important}
.trow .nm{font-size:16px;font-weight:600;flex:1;min-width:120px}
.trow input{width:150px;text-align:left}
.setrow{margin-bottom:14px}
.setrow label{display:block;font-size:13px;color:#777;margin-bottom:5px}
.setrow input,.setrow select{width:100%;text-align:left;padding:9px 10px}
.ph{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid #e2e2e2;vertical-align:middle;margin-right:8px}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
</style></head><body>
<div id="root"><div class="login"><h1>Кабинет заведения</h1>
<input id="l" class="lin" placeholder="Логин"><input id="p" class="lin" type="password" placeholder="Пароль">
<button class="btn p" style="width:100%;padding:11px" id="loginBtn" onclick="login()">Войти</button>
<div class="note" id="err" style="margin-top:10px;color:#dc2626"></div>
<div style="margin-top:12px"><a href="#" style="font-size:13px;color:#2563eb" onclick="toggleRec(event)">Забыли пароль? Восстановить по номеру телефона</a></div>
<div id="recBox" style="display:none;margin-top:12px;border:1px solid #e2e2e2;border-radius:10px;padding:12px;text-align:left">
<div class="note" style="margin-bottom:8px">Введите логин и привязанный номер — придёт SMS с кодом. По коду зададите новый пароль.</div>
<input id="rc_l" class="lin" placeholder="Логин">
<input id="rc_ph" class="lin" placeholder="Привязанный номер, например 0555123456">
<button class="btn" style="width:100%" id="recBtn" onclick="recoverSend('manager')">Отправить код по SMS</button>
<div id="recStep2" style="display:none;margin-top:10px">
<input id="rc_code" class="lin" placeholder="Код из SMS (5 цифр)">
<input id="rc_nw" class="lin" type="password" placeholder="Новый пароль (минимум 6 символов)">
<input id="rc_nw2" class="lin" type="password" placeholder="Повторите новый пароль">
<button class="btn p" style="width:100%" id="recBtn2" onclick="recoverVerify('manager')">Задать новый пароль</button>
</div>
<div class="note" id="recMsg" style="margin-top:8px"></div>
</div></div></div>
<script src="/config.js"></script>
<script>
let me=null,view="menu",cats=[],mq="",sub={amount:5000,finik_ready:false};

// время Кыргызстана (UTC+6, без перехода на летнее)
const kgOff=6*3600*1000;
// Время Бишкека (UTC+6) — НЕ зависит от часового пояса устройства просматривающего
const kgDate=iso=>new Date(new Date(iso).getTime()+kgOff);
const kgHM=iso=>iso?kgDate(iso).toISOString().slice(11,16):"—";
const kgDay=iso=>kgDate(iso).toISOString().slice(0,10);
const kgDayStartISO=()=>{const n=new Date(Date.now()+kgOff);return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),-6)).toISOString();};
const uniqNo=tos=>{const used=new Set(tos.map(o=>o.order_no));let no=0;for(let t=0;t<60;t++){no=1000+Math.floor(Math.random()*9000);if(!used.has(no))break;}return no;};

const $=s=>document.querySelector(s);
function login(){
  const lg=document.getElementById("l").value.trim(),pw=document.getElementById("p").value;
  const err=document.getElementById("err");err.textContent="";
  const btn=document.getElementById("loginBtn");
  btn.textContent="Проверяем…";btn.disabled=true;
  sbLogin(lg,pw)
  .then(()=>sbMe())
  .then(r=>{if(r&&r.role==="manager"&&r.venue_id){me=r;draw();}else{sbLogout();btn.textContent="Войти";btn.disabled=false;err.textContent="Неверный логин или пароль";alert("Неверный логин или пароль.\\n\\nЛогин — маленькие буквы, без пробелов. Пароль выдал владелец платформы.");}})
  .catch(e=>{btn.textContent="Войти";btn.disabled=false;err.textContent="Ошибка: "+e.message;alert("Ошибка входа:\\n"+e.message);});
}
function logout(){sbLogout();me=null;location.href=location.pathname;}
function toggleRec(e){e.preventDefault();const b=document.getElementById("recBox");b.style.display=b.style.display==="none"?"block":"none";}
async function recoverSend(scope){
  const lg=document.getElementById("rc_l").value.trim(),ph=document.getElementById("rc_ph").value.trim();
  const msg=document.getElementById("recMsg"),btn=document.getElementById("recBtn");
  if(!lg||!ph){msg.style.color="#dc2626";msg.textContent="Заполните логин и номер телефона";return;}
  btn.disabled=true;btn.textContent="Отправляем…";msg.textContent="";
  try{
    const r=await fetch(SUPABASE_URL+"/functions/v1/recover-access",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({step:"send",login:lg,phone:ph,scope})});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||("HTTP "+r.status));
    document.getElementById("recStep2").style.display="block";
    msg.style.color="#16a34a";msg.textContent="Код отправлен по SMS на номер "+d.sent_to+". Действует 10 минут.";
  }catch(e){msg.style.color="#dc2626";msg.textContent=String(e.message||e);alert("Ошибка: "+e.message);}
  btn.disabled=false;btn.textContent="Отправить код по SMS";
}
async function recoverVerify(scope){
  const lg=document.getElementById("rc_l").value.trim(),code=document.getElementById("rc_code").value.trim();
  const nw=document.getElementById("rc_nw").value,nw2=document.getElementById("rc_nw2").value;
  const msg=document.getElementById("recMsg"),btn=document.getElementById("recBtn2");
  if(nw.length<6){msg.style.color="#dc2626";msg.textContent="Новый пароль — минимум 6 символов";return;}
  if(nw!==nw2){msg.style.color="#dc2626";msg.textContent="Новые пароли не совпадают";return;}
  btn.disabled=true;btn.textContent="Проверяем…";
  try{
    const r=await fetch(SUPABASE_URL+"/functions/v1/recover-access",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({step:"verify",login:lg,scope,code,new_password:nw})});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||("HTTP "+r.status));
    msg.style.color="#16a34a";msg.textContent="Готово! Войдите с логином "+d.login+" и новым паролем.";
    alert("Пароль изменён!\n\nТеперь войдите: логин "+d.login+" и ваш новый пароль.");
    document.getElementById("recStep2").style.display="none";
  }catch(e){msg.style.color="#dc2626";msg.textContent=String(e.message||e);alert("Ошибка: "+e.message);}
  btn.disabled=false;btn.textContent="Задать новый пароль";
}
async function draw(){
  const v=me.venues;
  const ro=v.status!=="active";
  const isDemo=v.slug==="demo";
  let html='<div class="headrow"><h1>'+v.name+'<small>личный кабинет заведения</small></h1><button class="btn" onclick="logout()">Выйти</button></div>';
  if(isDemo)html+='<div class="banner" style="background:#fef3c7;border-color:#f59e0b;color:#92400e"><b>Демо-режим.</b> Это витринное заведение: нажимайте всё подряд, ничего не сломается — каждое утро в 04:00 меню, столы и заказы обновляются автоматически, пароль входа возвращается на стандартный.</div>';
  let bc=null;
  try{bc=await sbRpc("get_broadcast");}catch(e){}
  if(bc&&bc.text&&sessionStorage.getItem("bc_at")!==String(bc.at)){
    html+='<div class="banner" style="background:#eff6ff;border-color:#3b82f6;color:#1e40af"><b>Сообщение от владельца платформы:</b><br>'+String(bc.text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")+'<br><button class="btn" style="margin-top:8px" onclick="dismissBc()">Понятно, скрыть</button></div>';
    window._bcAt=String(bc.at);
  }
  if(v.status==="grace")html+='<div class="banner">Подписка просрочена (была оплачена до '+v.paid_until+'). Редактирование закрыто до оплаты. Сайт и приём заказов работают.</div>';
  if(v.status==="blocked")html+='<div class="banner" style="background:#fee2e2;border-color:#ef4444;color:#991b1b">Сервис заблокирован за неоплату. Свяжитесь с владельцом платформы.</div>';
  const todayStr=kgDate(new Date().toISOString()).toISOString().slice(0,10);
  const overdue=v.paid_until&&v.paid_until<=todayStr;
  sub={amount:5000,finik_ready:false};
  try{sub=await sbRpc("subscription_info")||sub;}catch(e){}
  const justPaid=new URLSearchParams(location.search).get("paid")==="1";
  const isTrial=v.plan==="trial";
  const daysLeft=v.paid_until?Math.ceil((new Date(v.paid_until+"T00:00:00Z")-new Date(todayStr+"T00:00:00Z"))/86400000):0;
  if(!isDemo)html+='<div style="border:1px solid '+(overdue?'#ef4444':'#e2e2e2')+';border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px" id="subbox">'+
   (isTrial
    ?'<b>Тестовый период:</b> '+(overdue?'<span style="color:#dc2626;font-weight:700">закончился</span>':'бесплатно до <b>'+v.paid_until+'</b> (осталось '+daysLeft+' дн.)')+
     '<br><span class="note">Дальше — '+fmt(sub.amount)+' в месяц. Понравилось? Оплатите онлайн или переводом — и работайте дальше. Не подошло — ничего платить не нужно, доступ выключится сам.</span><br>'
    :'<b>Подписка:</b> '+(overdue?'<span style="color:#dc2626;font-weight:700">просрочена</span> — оплатите '+fmt(sub.amount)+' (30 дней)':'оплачена до <b>'+v.paid_until+'</b>')+
     (justPaid?'<br><span style="color:#2563eb;font-weight:600">Платёж отправлен — проверяем зачисление…</span>':'')+
     '<br><span class="note">Оплата — '+fmt(sub.amount)+' за 30 дней. Оплатили — и срок продлевается с даты окончания текущего. Можно платить за несколько месяцев вперёд. При онлайн-оплате продление автоматическое, подтверждение владельца не нужно.</span><br>')+
   (sub.finik_ready?'<button class="btn p" style="margin-top:8px" id="paySubBtn" onclick="paySubscription()">Оплатить '+fmt(sub.amount)+' онлайн</button> ':'')+
   '<button class="btn" style="margin-top:8px" onclick="requestRenewal()">Оплатил переводом — сообщить владельцу</button>'+
   (v.venue_no?'<div class="note" style="margin-top:10px">При оплате переводом укажите в комментарии: <b style="font-size:15px">Заведение №'+v.venue_no+'</b> — по нему ваша оплата находится мгновенно.</div>':'')+'</div>';
  html+='<div class="tabs">'+
  '<button class="tab'+(view==="menu"?' on':'')+'" data-v="menu">Меню и цены</button>'+
  '<button class="tab'+(view==="tables"?' on':'')+'" data-v="tables">Столы и QR</button>'+
  '<button class="tab'+(view==="orders"?' on':'')+'" data-v="orders">Заказы</button>'+
  '<button class="tab'+(view==="revenue"?' on':'')+'" data-v="revenue">Выручка</button>'+
  '<button class="tab'+(view==="stats"?' on':'')+'" data-v="stats">Статистика</button>'+
  '<button class="tab'+(view==="settings"?' on':'')+'" data-v="settings">Настройки</button>'+
  '<button class="tab'+(view==="faq"?' on':'')+'" data-v="faq">Помощь</button></div><div id="body"></div>';
  root.innerHTML=html;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.v;draw();});
  const runSection=async fn=>{try{await fn();}catch(e){const b=document.getElementById("body");if(b)b.innerHTML='<div class="banner" style="background:#fee2e2;border-color:#ef4444;color:#991b1b"><b>Раздел не загрузился.</b> Обновите страницу (Ctrl+Shift+R). Если не помогло — напишите владельцу платформы: '+OWNER_WHATSAPP+'<br><span class="note">Технически: '+String(e&&e.message||e)+'</span></div>';}};
  if(view==="menu")runSection(drawMenu);
  else if(view==="tables")runSection(drawTables);
  else if(view==="revenue")runSection(drawRevenue);
  else if(view==="stats")runSection(drawStats);
  else if(view==="settings")runSection(drawSettings);
  else if(view==="faq")runSection(drawFaq);
  else runSection(drawOrders);
  if(justPaid)pollSub(0);
  if(new URLSearchParams(location.search).get("welcome")==="1"){
    history.replaceState(null,"","/manager.html");
    setTimeout(()=>alert("Добро пожаловать в Upservis! Ваше заведение создано — тестовый период 14 дней.\n\nС чего начать:\n1) Вкладка «Меню и цены» — замените демо-блюда на свои (или удалите и создайте заново).\n2) «Столы и QR» — скачайте таблички и разложите на столах.\n3) «Помощь» — пошаговая инструкция по всему.\n\nВопросы — WhatsApp "+OWNER_WHATSAPP),400);
  }
}
let subPollTimer=null;
async function pollSub(n){
  if(subPollTimer)clearTimeout(subPollTimer);
  if(n>=24)return; // 2 минуты проверки
  subPollTimer=setTimeout(async()=>{
    try{
      const fresh=await sbMe();
      const todayStr=kgDate(new Date().toISOString()).toISOString().slice(0,10);
      if(fresh&&fresh.venues&&fresh.venues.paid_until>todayStr){
        me=fresh;
        alert("Оплата получена! Подписка продлена до "+fresh.venues.paid_until+".");
        history.replaceState(null,"","/manager.html");
        draw();
        return;
      }
    }catch(e){}
    pollSub(n+1);
  },5000);
}
async function paySubscription(){
  const btn=document.getElementById("paySubBtn");
  if(btn){btn.disabled=true;btn.textContent="Создаём платёж…";}
  try{
    const r=await fetch(SUPABASE_URL+"/functions/v1/sub-pay",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SB_TOKEN},body:JSON.stringify({back:location.origin+"/manager.html?paid=1"})});
    const d=await r.json();
    if(!r.ok||!d.payment_url)throw new Error(d.error||("HTTP "+r.status));
    location.href=d.payment_url;
  }catch(e){
    alert("Не удалось создать платёж: "+e.message+"\n\nМожно оплатить переводом и нажать «Оплатил переводом» ниже.");
    if(btn){btn.disabled=false;btn.textContent="Оплатить онлайн";}
  }
}
async function drawMenu(){
  cats=await sb("categories?venue_id=eq."+me.venue_id+"&order=position");
  const ro=me.venues.status!=="active";
  const q=mq.trim().toLowerCase();
  let rows='<div class="addrow" style="margin-bottom:14px"><input id="mq" placeholder="Поиск блюда — начните вводить название" style="flex:1" value="'+mq.replace(/"/g,'&quot;')+'" oninput="mq=this.value;drawMenu()">'+(q?'<button class="btn" onclick="mq=\'\';drawMenu()">Сбросить</button>':'')+'</div>';
  for(const c of cats){
    let items=await sb("items?category_id=eq."+c.id+"&order=position");
    if(q)items=items.filter(i=>((i.name||"")+" "+(i.description||"")).toLowerCase().includes(q));
    if(q&&!items.length)continue;
    rows+='<div class="cat"><span>'+c.name+'</span>'+(ro?'':'<span><button class="btn danger" onclick="delCat(\''+c.id+'\',\''+c.name.replace(/'/g,"")+'\')">Удалить категорию</button></span>')+'</div><table>'+
    (items.length?items.map(i=>'<tr><td style="'+(i.active?'':'opacity:.4')+'">'+(i.photo?'<img class="ph" src="'+SUPABASE_URL+'/storage/v1/object/public/dishes/'+i.photo+'">':'')+i.name+(ro?'<br><span class="note">'+(i.description||'')+'</span>':'<br><input value="'+(i.description||'').replace(/"/g,'&quot;')+'" placeholder="Состав / грамовка — напр.: 450 г · курица, лаваш, соус" style="width:100%;max-width:340px;text-align:left;margin-top:4px;font-size:13px" onchange="setDesc(\''+i.id+'\',this.value)">')+'</td>'+
    '<td style="text-align:right;white-space:nowrap">'+(ro?'<span class="chip warn">только чтение</span>':
    '<input type="number" value="'+i.price+'" onchange="setPrice(\''+i.id+'\',this.value)"> сом '+
    '<button class="btn" onclick="tog(\''+i.id+'\','+i.active+')">'+(i.active?"Скрыть":"Показать")+'</button> '+
    '<label class="btn" style="display:inline-block">Фото<input type="file" accept="image/*" style="display:none" onchange="upPhoto(\''+i.id+'\',this)"></label>'+
    (i.photo?' <button class="btn" onclick="rmPhoto(\''+i.id+'\')">Убрать фото</button>':'')+
    ' <button class="btn danger" onclick="delItem(\''+i.id+'\',\''+i.name.replace(/'/g,"")+'\')">Удалить</button>')+'</td></tr>').join(""):'<tr><td colspan="2" class="note">Позиций нет</td></tr>')+'</table>';
  }
  if(!ro)rows+='<div class="addrow" style="margin-top:18px"><input id="ncat" placeholder="Новая категория (например: Завтраки)"><button class="btn p" onclick="addCat()">Добавить категорию</button></div>'+
  '<div class="addrow"><select id="nc">'+cats.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join("")+'</select><input id="nn" placeholder="Название позиции"><input id="np" type="number" placeholder="Цена"><button class="btn p" onclick="addItem()">Добавить</button></div>';
  if(q&&rows.indexOf("<table")===-1)rows+='<div class="note" style="margin-top:10px">Ничего не найдено по запросу «'+mq.replace(/</g,'&lt;')+'»</div>';
  $("#body").innerHTML=rows;
  const mqEl=document.getElementById("mq");
  if(mqEl&&q){mqEl.focus();mqEl.setSelectionRange(mqEl.value.length,mqEl.value.length);}
}
async function drawTables(){
  const ts=await sb("tables?venue_id=eq."+me.venue_id+"&order=created_at");
  const vk=me.venues.slug||(me.venues.domain||"").split(".").slice(1).join(".");
  $("#body").innerHTML='<div class="note">QR-коды для печати: назовите стол («Терраса 1», «Зал — окно») — код обновится автоматически. Новые столы появляются в конце списка.</div>'+

async function drawRevenue(){

  const curM=months[0];
  let os=null,cached=false;
  if(revM!==curM){
    try{const c=JSON.parse(localStorage.getItem("rev_"+me.venue_id+"_"+revM));if(c&&c.os){os=c.os;cached=true;}}catch(e){}
  }
  if(!os){

  const days=Object.keys(day).sort().reverse();
  const sumPaid=days.reduce((s,d)=>s+day[d].paid,0),sumRev=days.reduce((s,d)=>s+day[d].rev,0),sumN=days.reduce((s,d)=>s+day[d].n,0);

   '<div class="stats" style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px">'+
   '<div><b style="font-size:19px">'+fmt(sumPaid)+'</b><br><span class="note">оплачено за '+MNAMES[+revM.slice(5,7)-1].toLowerCase()+'</span></div>'+
   '<div><b style="font-size:19px">'+fmt(sumRev)+'</b><br><span class="note">сумма всех заказов</span></div>'+
   '<div><b style="font-size:19px">'+sumN+'</b><br><span class="note">заказов</span></div></div>'+

}
async function drawStats(){
  const os=await sb("orders?venue_id=eq."+me.venue_id+"&order=created_at.desc&limit=1000&select=created_at,items,accepted_at,ready_at,done_at");
  const dishes={};
  os.forEach(o=>(o.items||[]).forEach(i=>{dishes[i.name]=(dishes[i.name]||0)+ +i.qty;}));
  const top=Object.entries(dishes).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const mins=ms=>Math.round(ms/60000);
  const prep=os.filter(o=>o.accepted_at&&o.ready_at).map(o=>new Date(o.ready_at)-new Date(o.accepted_at));
  const waits=os.filter(o=>o.accepted_at).map(o=>new Date(o.accepted_at)-new Date(o.created_at));
  const full=os.filter(o=>o.done_at).map(o=>new Date(o.done_at)-new Date(o.created_at));
  const stat=a=>a.length?{n:a.length,min:mins(Math.min(...a)),avg:mins(a.reduce((s,x)=>s+x,0)/a.length),max:mins(Math.max(...a))}:null;
  const P=stat(prep),W=stat(waits),F=stat(full);
  let html='<h2 style="font-size:16px;margin:4px 0 10px">Топ блюд (по '+os.length+' заказам)</h2>'+(top.length?'<table><tr><th>#</th><th>Блюдо</th><th>Заказано, шт</th></tr>'+top.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join("")+'</table>':'<div class="note">Пока нет данных</div>');
  html+='<h2 style="font-size:16px;margin:22px 0 10px">Скорость кухни</h2><table><tr><th>Показатель</th><th>Быстрее всего</th><th>Среднее</th><th>Дольше всего</th><th>Заказов</th></tr>'+
   '<tr><td>Приготовление (принят → готов)</td>'+(P?'<td>'+P.min+' мин</td><td><b>'+P.avg+' мин</b></td><td>'+P.max+' мин</td><td>'+P.n+'</td>':'<td colspan="4" class="note">нет данных</td>')+'</tr>'+
   '<tr><td>Ожидание принятия (получен → принят)</td>'+(W?'<td>'+W.min+' мин</td><td><b>'+W.avg+' мин</b></td><td>'+W.max+' мин</td><td>'+W.n+'</td>':'<td colspan="4" class="note">нет данных</td>')+'</tr>'+
   '<tr><td>Весь цикл (получен → выдан)</td>'+(F?'<td>'+F.min+' мин</td><td><b>'+F.avg+' мин</b></td><td>'+F.max+' мин</td><td>'+F.n+'</td>':'<td colspan="4" class="note">нет данных</td>')+'</tr></table>';
  $("#body").innerHTML=html;
}

  if(!n||!p){alert("Впишите название и цену позиции");return;}
  sb("items",{method:"POST",body:JSON.stringify({category_id:c,name:n,price:p})})
   .then(()=>{alert("Позиция «"+n+"» добавлена.");drawMenu();})
   .catch(e=>alert("Ошибка: "+e.message));
}
async function upPhoto(id,inp){
  const f=inp.files[0];if(!f)return;
  const path=me.venue_id+"/"+id+".jpg";
  const r=await fetch(SUPABASE_URL+"/storage/v1/object/dishes/"+path+"?upsert=true",{
    method:"POST",
    headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SB_TOKEN,"Content-Type":f.type},
    body:f});
  if(!r.ok){alert("Ошибка загрузки: "+await r.text());return;}
  await sb("items?id=eq."+id,{method:"PATCH",body:JSON.stringify({photo:path})});
  drawMenu();
}

function saveSettings(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():null;};
  const body={name:g("sv_name")||me.venues.name,tagline:g("sv_tag")||""};
  if(g("sv_phone")!==null)body.contact_phone=g("sv_phone");
  const paySel=g("sv_pay");
  if(paySel){
    body.pay_provider=paySel;
    body.pay_config=Object.assign({},me.venues.pay_config||{});
    if(g("pk_acc")!==null)body.pay_config.account=g("pk_acc");
    if(g("pk_bank")!==null)body.pay_config.bank=g("pk_bank");
    if(g("pk_link")!==null)body.pay_config.link=g("pk_link");
    if(g("pk_finik_acc")!==null)body.pay_config.finik_account=g("pk_finik_acc");
    if(g("pk_finik_key")!==null)body.pay_config.finik_apikey=g("pk_finik_key");
    if(g("pk_finik_priv")!==null)body.pay_config.finik_privkey=g("pk_finik_priv");
    if(g("pk_finik_env")!==null)body.pay_config.finik_env=g("pk_finik_env");
    if(g("pk_obank_sid")!==null)body.pay_config.obank_sid=g("pk_obank_sid");
    if(g("pk_obank_pwd")!==null)body.pay_config.obank_password=g("pk_obank_pwd");
    if(g("pk_obank_test")!==null)body.pay_config.obank_test=g("pk_obank_test");
    if(g("pk_obank_knock")!==null)body.pay_config.obank_knock=g("pk_obank_knock");
    if(g("pk_mid")!==null)body.pay_config.merchant_id=g("pk_mid");
    if(g("pk_key")!==null)body.pay_config.api_key=g("pk_key");
  }
  const kkmSel=g("sv_kkm");
  if(g("sv_style")!==null)body.menu_style=g("sv_style");
  if(kkmSel){
    body.kkm_provider=kkmSel;
    body.kkm_config=Object.assign({},me.venues.kkm_config||{});
    if(g("kk_srv")!==null)body.kkm_config.server=g("kk_srv");
    if(g("kk_key")!==null)body.kkm_config.api_key=g("kk_key");
    if(g("kk_slip")!==null)body.kkm_config.slip=g("kk_slip");
    if(g("kk_note")!==null)body.kkm_config.note=g("kk_note");
    if(g("kk_rnm")!==null)body.kkm_config.kkm1c_rnm=g("kk_rnm");
    if(g("kk_login1c")!==null)body.kkm_config.kkm1c_login=g("kk_login1c");
    if(g("kk_pwd1c")!==null)body.kkm_config.kkm1c_pwd=g("kk_pwd1c");
    if(g("kk_cfgname")!==null)body.kkm_config.kkm1c_configname=g("kk_cfgname");
    if(g("kk_cfgver")!==null)body.kkm_config.kkm1c_configversion=g("kk_cfgver");
    if(g("kk_wpid")!==null)body.kkm_config.kkm1c_workplace=g("kk_wpid");
  }
  sb("venues?id=eq."+me.venue_id,{method:"PATCH",body:JSON.stringify(body)})
   .then(()=>{me.venues=Object.assign(me.venues,body);alert("Настройки сохранены.");draw();})
   .catch(e=>alert("Ошибка: "+e.message));
}
if(sessionStorage.getItem("sb_token")){
  sbMe().then(r=>{if(r&&r.role==="manager"&&r.venue_id){me=r;draw();}else sbLogout();})
